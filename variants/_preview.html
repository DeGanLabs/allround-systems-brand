<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mark compare</title>
  <style>
    body { margin: 0; background: #F5F3ED; font-family: sans-serif; padding: 24px; }
    .row { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
    .box { text-align: center; }
    img, object { width: 220px; height: 220px; background: #fff; border: 1px solid #ddd; }
    h1 { font-size: 16px; color: #0B243B; }
  </style>
</head>
<body>
  <div class="row">
    <div class="box">
      <h1>Exact PNG</h1>
      <img src="as-mark-exact.png" alt="exact" />
    </div>
    <div class="box">
      <h1>SVG color</h1>
      <img src="../svg/as-mark-color.svg" alt="svg" />
    </div>
    <div class="box">
      <h1>SVG stacked traced</h1>
      <img src="../svg/as-lockup-stacked-traced.svg" alt="stacked" style="height:260px;width:auto" />
    </div>
    <div class="box">
      <h1>Horizontal light</h1>
      <img src="../svg/as-lockup-horizontal-light.svg" alt="h" style="width:360px;height:auto" />
    </div>
  </div>
</body>
</html>
